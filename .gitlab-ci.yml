stages:
  - Deques
  - Autocomplete
  - Priority Queues
  - Shortest Paths
  - Collections

workflow:
  auto_cancel:
    on_job_failure: none

ArrayListDequeTests:
  stage: Deques
  rules:
    - changes:
        - src/main/java/deques/*.java
  script: ./gradlew --warning-mode=all test --tests "deques.ArrayListDequeTests"
  when: always

